databaseChangeLog:
  - changeSet:
      author: Alejandro Gómez Lucena
      comment: define the base schema for saving and querying prices in our system.
      id: 'price-service-00001'
      changes:
        - createTable:
            tableName: prices
            columns:
              - column:
                  name: brand_id
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: price_list
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: decimal
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(3)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: last_update
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: last_update_by
                  type: varchar(100)
                  constraints:
                    nullable: false

        - addPrimaryKey:
            constraintName: pk_prices
            tableName: prices
            columnNames: brand_id,product_id,price_list

        - createIndex:
            indexName: idx_prices_dates
            tableName: prices
            columns:
              - column:
                  name: start_date
              - column:
                  name: end_date

