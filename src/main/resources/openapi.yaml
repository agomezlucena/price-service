openapi: 3.1.0
info:
  title: Price service
  description: Service to query the applicable price for a product based on brand and application date.
  version: 1.0.0
servers:
  - url: 'http://localhost:8080'
    description: Local development server
components:
  schemas:
    PriceResponse:
      type: object
      description: Response payload containing the applicable price details for a product.
      required:
        - brand_id
        - product_id
        - charge_id
        - price
        - currency
        - price_start_at
        - price_ends_at
      properties:
        brand_id:
          description: Identifier of the brand associated with the product (e.g. 1).
          type: integer
          example: 1
        product_id:
          description: Identifier of the product (e.g. 35455).
          type: integer
          example: 35455
        charge_id:
          description: Identifier of the applicable price list or rate applied to the product.
          type: integer
          example: 1
        price:
          description: Final amount to be paid by the customer for the product.
          type: number
          example: 35.50
        currency:
          description: ISO 4217 three-letter currency code (e.g. EUR).
          type: string
          pattern: '^[A-Z]{3}$'
          example: 'EUR'
        price_start_at:
          description: Start timestamp of the price validity period in ISO-8601 format.
          type: string
          format: date-time
          example: '2020-06-14T00:00:00Z'
        price_ends_at:
          description: End timestamp of the price validity period in ISO-8601 format.
          type: string
          format: date-time
          example: '2020-12-31T23:59:59Z'
      example:
        brand_id: 1
        product_id: 35455
        charge_id: 1
        price: 35.50
        currency: 'EUR'
        price_start_at: '2020-06-14T00:00:00Z'
        price_ends_at: '2020-12-31T23:59:59Z'

    ProblemDetail:
      type: object
      description: Representation of an RFC 9457 Problem Details error response.
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: 'Price not found'
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 404
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: 'Price was not found'
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem.
          example: '/api/v1/products/80/prices'
        properties:
          type: object
          additionalProperties: true
          description: Generic map for additional custom problem details and extension members.
      example:
        title: 'Price not found'
        status: 404
        detail: 'Price was not found'
        instance: '/api/v1/products/80/prices'
tags:
  - name: Price query
    description: Endpoints for querying product prices and rate schedules.
paths:
  /api/v1/products/{productId}/prices:
    get:
      operationId: getPrice
      summary: Retrieve the applicable product price
      description: |
        Obtains the applicable price for a specific product for a brand at a given application date and time.
        If multiple price rates overlap, the rate with the highest priority is selected.
      tags:
        - Price query
      parameters:
        - name: productId
          description: Identifier of the product for which the price is requested.
          in: path
          required: true
          schema:
            type: integer
            example: 35455
          example: 35455
        - name: X-Brand-Id
          description: Identifier of the brand, typically supplied by the gateway after client authentication.
          in: header
          required: true
          schema:
            type: integer
            example: 1
          example: 1
        - name: applicationDate
          description: Target date and time for determining the applicable price, in ISO-8601 format.
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: '2020-06-14T10:00:00Z'
          example: '2020-06-14T10:00:00Z'
      responses:
        '200':
          description: The applicable price was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
              examples:
                standardPrice:
                  summary: Standard price rate (e.g. Test 1)
                  description: Applicable price for product 35455 at 2020-06-14 10:00:00 UTC.
                  value:
                    brand_id: 1
                    product_id: 35455
                    charge_id: 1
                    price: 35.50
                    currency: 'EUR'
                    price_start_at: '2020-06-14T00:00:00Z'
                    price_ends_at: '2020-12-31T23:59:59Z'
                promotionalPrice:
                  summary: Specific window price rate (e.g. Test 2)
                  description: Applicable price for product 35455 at 2020-06-14 16:00:00 UTC.
                  value:
                    brand_id: 1
                    product_id: 35455
                    charge_id: 2
                    price: 25.45
                    currency: 'EUR'
                    price_start_at: '2020-06-14T15:00:00Z'
                    price_ends_at: '2020-06-14T18:30:00Z'
        '400':
          description: Invalid request parameters supplied (e.g. malformed date or missing headers).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                invalidDateFormat:
                  summary: Malformed applicationDate query parameter
                  value:
                    title: 'Bad Request'
                    status: 400
                    detail: "Failed to convert 'applicationDate' with value: 'invalid-date'"
                    instance: '/api/v1/products/35455/prices'
                missingHeader:
                  summary: Missing required X-Brand-Id header
                  value:
                    title: 'Bad Request'
                    status: 400
                    detail: "Required header 'X-Brand-Id' is not present."
                    instance: '/api/v1/products/35455/prices'
                missingParam:
                  summary: Missing required applicationDate query parameter
                  value:
                    title: 'Bad Request'
                    status: 400
                    detail: "Required parameter 'applicationDate' is not present."
                    instance: '/api/v1/products/35455/prices'
        '404':
          description: No price was found for the specified product, brand, and application date criteria.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: 'Price not found'
                status: 404
                detail: 'Price was not found'
                instance: '/api/v1/products/80/prices'
        '500':
          description: An unexpected internal server error occurred while processing the request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: 'Internal Server Error'
                status: 500
                detail: 'An unexpected error occurred while querying the price service'
                instance: '/api/v1/products/35455/prices'
