openapi: 3.1.0
info:
  title: Price service
  description: Gets the price for a product based in a given date.
  version: 1.0.0
servers:
  - url: 'http://localhost:8080'
components:
  schemas:
    PriceResponse:
      type: object
      description: Represent a price
      properties:
        brand_id:
          description: represents the brand of the product
          type: integer
        product_id:
          description: represents the id of the product
          type: integer
        charge_id:
          description: represent the id of the charge
          type: integer
        price:
          description: represent the final amount to pay by the customer
          type: decimal
        currency:
          description: represent the currency to be payed the currency is indicated in ISO 4217 standard
          type: string
          pattern: '^[A-Z]{3}$'
        price_start_at:
          description: when that price start
          type: string
          format: date-time
        price_ends_at:
          description: when that price ends
          type: string
          format: date-time

    ProblemDetail:
      type: object
      description: Representation of an RFC 9457 Problem Details error response,
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: 'Bad Request'
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 400
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: 'Invalid request parameters'
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem.
          example: '/api/v1/products/1/prices'
        properties:
          type: object
          additionalProperties: true
          description: Generic map for additional custom problem details and extension members.

paths:
  /api/v1/products/{productId}/prices:
    get:
      description: |
        obtains the price of the specific product based in the brand and the application date of the product.
      parameters:
        - name: productId
          description: id of the product
          in: path
          required: true
          schema:
            type: integer
        - name: X-Brand-Id
          description: id of the brand produced by the gateway after client authentication.
          in: header
          required: true
          schema:
            type: integer
        - name: applicationDate
          description: date for getting the price
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        200:
          description: the price was obtained successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
        400:
          description: some of the parameters are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        404:
          description: no price was found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        500:
          description: an unknown error happened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
